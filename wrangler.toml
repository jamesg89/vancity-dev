name = "vancity-dev"
main = ".svelte-kit/build/cloudflare/_worker.js"
compatibility_date = "2026-05-05"
compatibility_flags = ["nodejs_compat"]

# Access policies are scoped to vancity.dev, so they cannot cover a workers.dev URL.
# Leaving it enabled would expose /admin on a hostname Access never sees.
workers_dev = false

[assets]
directory = ".svelte-kit/build/cloudflare"
binding = "ASSETS"

[[routes]]
pattern = "*.vancity.dev"
zone_name = "vancity.dev"

[[routes]]
pattern = "*.vancity.dev/*"
zone_name = "vancity.dev"

[[send_email]]
name = "SEND_EMAIL"
destination_address = "james@vancity.dev"

[[d1_databases]]
binding = "DB"
database_name = "vancity-prospects"
# PLACEHOLDER: replace with the id printed by `wrangler d1 create vancity-prospects`
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
